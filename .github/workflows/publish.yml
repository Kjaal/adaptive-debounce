name: Package and publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact committed SemVer shared by all four packages
        required: true
        type: string
      mode:
        description: Package only, or publish after protected approval
        required: true
        default: package-only
        type: choice
        options:
          - package-only
          - publish
      npm_tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      auth_mode:
        description: Trusted publishing, or the one-time bootstrap token
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - bootstrap-token
      confirmation:
        description: For publish mode, enter "publish VERSION to TAG"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the contributor Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate immutable npm publication policy
        run: node scripts/check-release.mjs policy
      - name: Check the resumable npm publication guard
        run: node scripts/publish-release.mjs self-test
      - name: Validate committed release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs source
      - name: Validate the protected publish request
        if: ${{ inputs.mode == 'publish' }}
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs dispatch
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check the core package
        run: pnpm check
      - name: Check and retain the exact framework tarballs
        env:
          ADAPTIVE_DEBOUNCE_RELEASE_DIR: ${{ github.workspace }}/release
          ADAPTIVE_DEBOUNCE_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm framework:check
      - name: Confirm checks did not change tracked files
        run: |
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
      - name: Validate retained tarballs
        env:
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs artifacts
      - name: Create checksums
        working-directory: release
        run: sha256sum *.tgz > SHA256SUMS
      - name: Validate checksummed tarballs
        env:
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs artifacts
      - name: Upload validated npm tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish to npm
    if: ${{ inputs.mode == 'publish' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Confirm the publishing runtime
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Download the validated npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-candidate
          path: release
      - name: Revalidate the protected publish request
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs dispatch
      - name: Revalidate committed release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs source
      - name: Verify checksums and tarball manifests
        env:
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          node scripts/check-release.mjs artifacts
      - name: Publish with npm trusted publishing
        if: ${{ inputs.auth_mode == 'trusted' }}
        env:
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release
          RELEASE_NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          unset NODE_AUTH_TOKEN
          node scripts/publish-release.mjs publish
      - name: Publish with the one-time bootstrap token
        if: ${{ inputs.auth_mode == 'bootstrap-token' }}
        env:
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_BOOTSTRAP }}
          RELEASE_NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "The npm-publish environment does not contain NPM_TOKEN_BOOTSTRAP."
            exit 1
          fi
          node scripts/publish-release.mjs publish
